# ============================================================
# Clash / Mihomo  Override 复写文件
# 来源逻辑：文件 B（SubConverter ACL4SSR 自定义规则）
# 输出格式：文件 A（Clash Meta YAML）
# 特性：
#   · 全部策略组、规则集名称已去 Emoji
#   · 图标沿用 Qure IconSet/Color CDN 风格
#   · 地区节点组使用 url-test + filter 自动筛选
#   · 直接替换订阅中的 proxy-groups / rule-providers / rules
# ============================================================
# 适配客户端：mihomo-party / Clash Verge Rev / Clash Meta
# Override 机制说明：
#   本文件使用「直接替换」模式。
#   proxy-groups   → 完整替换订阅原有分组（节点由 include-all 自动注入）
#   rule-providers → 完整替换订阅原有规则集
#   rules          → 完整替换订阅原有路由规则
# ============================================================

# ──────────────────────────────────────────────────────────
# 一、策略组  proxy-groups
# ──────────────────────────────────────────────────────────
proxy-groups:

  # ── 核心调度组 ────────────────────────────────────────────

  - name: 节点选择
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    proxies:
      - 自动选择
      - 香港
      - 台湾
      - 新加坡
      - 日本
      - 美国
      - 韩国
      - 手动切换
      - 其他节点
      - DIRECT

  - name: 手动切换
