# ──────────────────────────────────────────────────────────
# 三、路由规则  rules
# 顺序与文件 B 的 ruleset 声明顺序保持一致
# 优先级：从上到下，首次匹配生效
# ──────────────────────────────────────────────────────────
rules:
  # ── 自定义规则（J54264）────────────────────────────────────
  - "RULE-SET,Game_j54,Game"
  - "RULE-SET,proxyjp,Japan代理"
  - "RULE-SET,ms_j54,微软"
  - "RULE-SET,Proxy_j54,节点选择"

  # ── 拦截广告 ──────────────────────────────────────────────
  - "RULE-SET,Reject_j54,拦截"
  - "RULE-SET,Adblock4limbo,拦截"
  - "RULE-SET,BanAD,拦截"
  - "RULE-SET,BanProgramAD,拦截"

  # ── 直连基础 ──────────────────────────────────────────────
  - "RULE-SET,Direct_j54,直连"
  - "RULE-SET,LocalAreaNetwork,直连"
  - "RULE-SET,UnBan,直连"
  - "RULE-SET,GoogleCN,直连"
  - "RULE-SET,SteamCN,直连"

  # ── 微软 / 苹果 ───────────────────────────────────────────
  - "RULE-SET,Microsoft,微软"
  - "RULE-SET,Apple,Apple"

  # ── 流媒体 ───────────────────────────────────────────────
  - "RULE-SET,TikTok,TikTok"
  - "RULE-SET,Telegram,Telegram"
  - "RULE-SET,Spotify,Spotify"
  - "RULE-SET,YouTube,YouTube"
  - "RULE-SET,Bahamut,巴哈姆特"
  - "RULE-SET,BilibiliHMT,哔哩哔哩"
  - "RULE-SET,Bilibili,哔哩哔哩"
  - "RULE-SET,ChinaMedia,国内媒体"
  - "RULE-SET,GlobalMedia,国外媒体"

  # ── 游戏平台 ─────────────────────────────────────────────
  - "RULE-SET,Epic,游戏平台"
  - "RULE-SET,EA,游戏平台"
  - "RULE-SET,Sony,游戏平台"
  - "RULE-SET,Steam,游戏平台"
  - "RULE-SET,Nintendo,游戏平台"

  # ── IP 测试 ───────────────────────────────────────────────
  - "RULE-SET,Check,IP测试"

  # ── 代理 GFW 列表 ─────────────────────────────────────────
  - "RULE-SET,Proxy_bm,节点选择"

  # ── 国内直连 ─────────────────────────────────────────────
  - "RULE-SET,ChinaDomain,直连"
  - "RULE-SET,ChinaCompanyIp,直连"
  - "RULE-SET,Download,直连"

  # ── GEOIP 兜底 ───────────────────────────────────────────
  - "GEOIP,CN,直连"

  # ── 最终兜底 ─────────────────────────────────────────────
  - "MATCH,漏网之鱼"
