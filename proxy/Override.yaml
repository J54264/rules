    include-all: true
    filter: "^(?!.*(港|HK|hk|Hong Kong|HongKong|hongkong|日本|东京|東京都|大阪|泉日|埼玉|JP|Japan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|SFO|NYC|Oregon|United States|台|中华民国|新北|彰化|TW|Taiwan|新加坡|坡|狮城|SG|Singapore|KR|Korea|KOR|首尔|韩|韓)).*$"


# ──────────────────────────────────────────────────────────
# 二、规则集  rule-providers
# ──────────────────────────────────────────────────────────
# 命名规则：直接使用规则文件名（不含路径与 .list 扩展名）
# 来源重复时在末尾加 _bm（blackmatrix7）或 _j54（J54264）以区分
# behavior 说明：
#   · classical → 混合型规则（DOMAIN/IP/PROCESS 均可）
#   · domain    → 纯域名列表（仅 DOMAIN/DOMAIN-SUFFIX）
#   · ipcidr    → 纯 IP CIDR 列表
# format 说明：
#   · text → 每行一条规则（ACL4SSR / J54264 / limbopro 格式）
#   · yaml → payload: [...] 格式（blackmatrix7 格式）
# ──────────────────────────────────────────────────────────
rule-providers:

  # ── J54264 自定义规则集 ───────────────────────────────────
  Game_j54:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/J54264/rules/main/proxy/Game.list
